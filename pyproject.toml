[project]
name = "gppb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "httpx>=0.27", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# launch/ and report/ are repo-root packages, not part of the installed
# distribution — pytest must see the root regardless of how it is invoked.
pythonpath = ["."]
